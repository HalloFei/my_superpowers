# Knowledge-base schema — THE single source of authority.
# Any workspace using the kb tool inherits this file; do not copy it into a workspace.
# Bump schema_version on breaking change; kb.py refuses a workspace pinned to another major.
schema_version: 1
tool: kb

# Status semantics. "final" is a TERMINAL RECORD state and is allowed only for
# types whose lifecycle has a real terminal event (plans, reviews).
statuses:
  draft:
    depends: no
    editable: yes
    terminal: no
    meaning: "在写 / 待评审；不可作为依据"
  active:
    depends: yes
    editable: yes
    terminal: no
    meaning: "现行权威或正在使用；可依赖，可追加 Revision"
  final:
    depends: yes
    editable: no
    terminal: yes
    meaning: "终态记录：已执行 / 已观测完毕；冻结，可引用但不可当指令"
  archived:
    depends: no
    editable: no
    terminal: yes
    meaning: "已退出语料；冻结；必须在 archive 目录"

# Allowed statuses per document type. The type is the first path segment under docs/.
types:
  framework: [draft, active, archived]
  specs: [draft, active, archived]
  knowledge: [draft, active, archived]
  ops: [draft, active, archived]
  plans: [draft, active, final, archived]
  reviews: [active, final, archived]
  decisions: [active, archived]   # opt-in: ADRs are records of decisions already made
  archive: [archived]

# Default status for a newly indexed file of each type.
defaults:
  framework: active
  specs: draft
  knowledge: active
  ops: active
  plans: active
  reviews: final
  decisions: active
  archive: archived

# Transitions the tool may apply (everything else needs the documented retrieval flow).
transitions:
  draft: [active, archived]
  active: [final, archived, draft]
  final: [archived]
  archived: [draft, active]

# Archive reason vocabulary (free text accepted, these are the expected values).
archive_reasons: [superseded, absorbed, historical, withdrawn, obsolete, completed]

# Header fields the engine reads, per type: `**<Name>:** <value>` (one line, one value).
# Declaring `decisions` in a workspace's docs/kb.yaml types map turns the decision
# protocol on for that workspace (spec: docs/specs/2026-11-06-decisions-protocol-design.md).
fields:
  decisions: [Topic]
  specs: [Decision]
  plans: [Spec]

# Column contracts for the generated index tables.
index_columns:
  active: [path, type, status]
  archive: [path, status, superseded_by, sha256, reason]

index_markers:
  active_start: "<!-- kb:active:start (generated by kb index; status column is authoritative) -->"
  active_end: "<!-- kb:active:end -->"
  archive_start: "<!-- kb:archive:start (generated by kb index; content frozen, sha256 enforced) -->"
  archive_end: "<!-- kb:archive:end -->"

# A workspace config (docs/kb.yaml) may override paths only, never rules.
