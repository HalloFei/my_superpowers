name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Engine syntax check
        run: python -c "import py_compile; py_compile.compile('scripts/kb.py', doraise=True)"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke
        run: python scripts/kb.py --help
